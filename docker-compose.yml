services:
  db:
    image: postgres:15
    container_name: movie_recommendation_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    
  web:
    build: .
    container_name: movie_recommendation_web
    command: >
        sh -c "python manage.py migrate &&
          python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/movie_recommendation
    ports:
      - "8000:8000"
    depends_on:
      db:
          condition: service_healthy
      redis:
          condition: service_started
    env_file:
      - .env
  
  redis:
    image: redis:latest
    container_name: movie_recommendation_redis
    ports:
      - "6380:6379"

  celery:
    build: .
    container_name: movie_recommendation_celery
    command: >
      sh -c "sleep 10 &&
             celery -A movie_recommendation_backend worker -l info"
    volumes:
      - .:/movie_recommendation
    depends_on:
      - db
      - redis
    env_file:
      - .env

volumes:
  postgres_data: