apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-app
  template:
    metadata:
      labels:
        app: movie-app
    spec:
      containers:
        - name: movie-app
          image: kiprotich507/movie-recommendation-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: movie-app-config
            - secretRef:
                name: movie-app-secret
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Waiting for Postgres..."
              while ! nc -z db 5432; do
                sleep 2
              done
              echo "Postgres started"

              python manage.py migrate
              python manage.py runserver 0.0.0.0:8000
